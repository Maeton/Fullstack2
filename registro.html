<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huerto Orgánico - Registro</title>
    <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>
    <header>
        <div>
            <h1>Huerto Orgánico</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="registro.html">Registro</a></li>
                <li><a href="carrito.html">Carrito</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Crear Cuenta</h2>
            <p>Ingresa tus datos para gestionar tu perfil, compras y direcciones de despacho.</p>

            <form id="form-registro" novalidate class="form-registro">
                <div>
                    <label for="nombre" class="form-label">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" class="form-input" required autocomplete="name">
                    <span id="error-nombre" class="error-mensaje"></span>
                </div>

                <div>
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" id="email" name="email" class="form-input" required autocomplete="email">
                    <span id="error-email" class="error-mensaje"></span>
                </div>

                <div>
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-input" required autocomplete="new-password">
                    <span id="error-password" class="error-mensaje"></span>
                </div>

                <div>
                    <label for="telefono" class="form-label">Teléfono de Contacto</label>
                    <input type="tel" id="telefono" name="telefono" class="form-input" placeholder="+56912345678" required autocomplete="tel">
                    <span id="error-telefono" class="error-mensaje"></span>
                </div>

                <div>
                    <label for="direccion" class="form-label">Dirección de Entrega</label>
                    <input type="text" id="direccion" name="direccion" class="form-input" placeholder="Calle, número, comuna y ciudad" required autocomplete="street-address">
                    <span id="error-direccion" class="error-mensaje"></span>
                </div>

                <button type="submit" class="form-button">
                    Registrar Cuenta
                </button>
            </form>
        </section>
    </main>

    <footer>
        <div>
            <p>Contacto: contacto@huertoorganico.cl | Teléfono: +56 9 6767 6767</p>
            <p>Ubicación: Parcela 67, Paine, Chile</p>
        </div>
    </footer>

    <script src="assets/js/script.js"></script>
</body>
</html>
