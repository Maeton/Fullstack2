<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huerto Orgánico - Registro</title>
    <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>
    <header>
        <div>
            <h1>Huerto Orgánico</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="registro.html">Registro</a></li>
                <li><a href="carrito.html">Carrito</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Crear Cuenta</h2>
            <p>Ingresa tus datos para gestionar tu perfil, compras y direcciones de despacho.</p>

            <form id="form-registro" style="max-width: 600px; margin-top: 2rem; display: flex; flex-direction: column; gap: 1.5rem;">
                <div>
                    <label for="nombre" style="display: block; font-weight: 700; margin-bottom: 0.5rem;">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" required style="width: 100%; padding: 0.8rem; background: transparent; border: 2px solid #0A0A0A; font-family: inherit; font-size: 1rem;">
                </div>

                <div>
                    <label for="email" style="display: block; font-weight: 700; margin-bottom: 0.5rem;">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required style="width: 100%; padding: 0.8rem; background: transparent; border: 2px solid #0A0A0A; font-family: inherit; font-size: 1rem;">
                </div>

                <div>
                    <label for="password" style="display: block; font-weight: 700; margin-bottom: 0.5rem;">Contraseña</label>
                    <input type="password" id="password" name="password" required style="width: 100%; padding: 0.8rem; background: transparent; border: 2px solid #0A0A0A; font-family: inherit; font-size: 1rem;">
                </div>

                <div>
                    <label for="telefono" style="display: block; font-weight: 700; margin-bottom: 0.5rem;">Teléfono de Contacto</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="+56912345678" required style="width: 100%; padding: 0.8rem; background: transparent; border: 2px solid #0A0A0A; font-family: inherit; font-size: 1rem;">
                </div>

                <div>
                    <label for="direccion" style="display: block; font-weight: 700; margin-bottom: 0.5rem;">Dirección de Entrega</label>
                    <input type="text" id="direccion" name="direccion" placeholder="Calle, número, comuna y ciudad" required style="width: 100%; padding: 0.8rem; background: transparent; border: 2px solid #0A0A0A; font-family: inherit; font-size: 1rem;">
                </div>

                <button type="submit" style="background-color: #0A0A0A; color: #E2DFD8; border: 2px solid #0A0A0A; padding: 1rem; font-weight: 700; font-size: 0.9rem; letter-spacing: 0.15em; cursor: pointer; text-transform: uppercase;">
                    Registrar Cuenta
                </button>
            </form>
        </section>
    </main>

    <footer>
        <div>
            <p>Contacto: contacto@huertoorganico.cl | Teléfono: +56 9 6767 6767</p>
            <p>Ubicación: Parcela 67, Paine, Chile</p>
        </div>
    </footer>

    <script src="assets/js/script.js"></script>
</body>
</html>
